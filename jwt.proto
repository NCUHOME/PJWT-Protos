syntax = "proto3";

package proto;

option go_package = ".;proto";

service Passport {
  rpc ParseJwt(RequestParseJwt) returns (ParseJwtResult) {}
  rpc GenToken(RequestGenToken) returns (GenTokenResult) {}
}

message RequestParseJwt {
  string token = 1;
}

message RequestGenToken {
  string xh = 1;
  // Token validity in nanoseconds. The server enforces its configured maximum.
  int64 valid = 2;
  // Credential associated with issuer. New issuing clients should provide it.
  string issue_key = 3;
  // Stable identifier of the service issuing the token.
  string issuer = 4;
}

message ParseJwtResult {
  Claims claims = 1;
  bool Valid = 2;
}

message GenTokenResult {
  string token = 1;
}

message Claims {
  string id = 1;
  string xh = 2;
  string issuer = 3;
}
